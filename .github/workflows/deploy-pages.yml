name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      cover_limit:
        description: "封面数量上限（0 = 下载全部）"
        required: false
        default: "0"
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Bundle frontend
        run: npm run build

      - name: Pre-generate cover assets
        env:
          COVER_LIMIT: ${{ inputs.cover_limit || '0' }}
          COVER_CONCURRENCY: 12
          COVER_RETRIES: 2
        run: npm run prepare:covers

      - name: Assemble static artifact
        run: |
          mkdir -p dist
          cp index.html style.css graph.json main.bundle.js .nojekyll dist/
          cp -r covers dist/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

