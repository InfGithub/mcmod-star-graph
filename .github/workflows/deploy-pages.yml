name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # 每三天（每月 1/4/7/…/28 日 02:30）合并全部数据包并增量检查封面
    - cron: "30 2 */3 * *"
  workflow_dispatch:
    inputs:
      cover_limit:
        description: "封面数量上限（0 = 下载全部）"
        required: false
        default: "0"
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 仓库只做渲染：图数据来自上游 Releases 的并集（旧+新），合并与下载都在
      # 构建期完成（浏览器无法跨域 fetch release 资产，release 域名无 CORS 头）。
      - name: Compute release set key
        id: release-set
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          names="$(gh api repos/InfGithub/mcmod-star-graph/releases?per_page=100 \
            --jq '[.[] | .assets[] | select(.name | startswith("graph-") and endswith(".json")) | .name] | sort | join(",")')"
          key="$(printf '%s' "$names" | sha256sum | cut -c1-16)"
          echo "key=${key}" >> "$GITHUB_OUTPUT"
          echo "releases=${names}"

      - name: Restore release asset cache
        id: release-cache
        uses: actions/cache/restore@v4
        with:
          path: release-cache
          key: release-cache-${{ steps.release-set.outputs.key }}-${{ github.sha }}
          restore-keys: |
            release-cache-${{ steps.release-set.outputs.key }}-

      - name: Merge all release graphs (old + new)
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/merge-release-graphs.mjs

      - name: Save release asset cache
        if: steps.release-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: release-cache
          key: release-cache-${{ steps.release-set.outputs.key }}-${{ github.sha }}

      - name: Restore static cover cache
        id: cover-cache
        uses: actions/cache/restore@v4
        with:
          path: covers
          # 覆盖缓存与数据版本解耦：旧图长期驻留，仅 URL 变化的图才重下
          key: covers-v3-${{ inputs.cover_limit || '0' }}-${{ github.sha }}
          restore-keys: |
            covers-v3-${{ inputs.cover_limit || '0' }}-
            covers-v3-

      # 封面由 CI 下载到 covers/（MC 百科防盗链只认服务端 Referer，浏览器直连会被
      # 403，因此下载发生在构建期）。规则：封面 URL 不变且文件已缓存 → 全部复用，
      # 零访问 mcmod；只有新增 key 或 URL 变化的图才增量下载；不再需要的旧图自动清理。
      - name: Pre-generate cover assets (diff only)
        env:
          COVER_LIMIT: ${{ inputs.cover_limit || '0' }}
          COVER_CONCURRENCY: 12
          COVER_RETRIES: 2
        run: node scripts/prepare-covers.mjs

      # 缩略图转换器：runner 镜像不保证预装 ImageMagick，探测缺失时安装
      - name: Install ImageMagick if missing
        run: |
          if ! command -v magick >/dev/null 2>&1 && ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends imagemagick
          fi
          if ! command -v magick >/dev/null 2>&1 && ! command -v convert >/dev/null 2>&1; then
            echo "::error::ImageMagick 安装失败"
            exit 1
          fi

      # 展示缩略图（96px）：WebGL 纹理内存约缩小 16 倍，配合前端视口懒加载；
      # 原图保留供导出。缩略图在 covers/ 内，随封面缓存一并持久化。
      - name: Pre-generate cover thumbnails
        env:
          THUMB_CONCURRENCY: 8
        run: node scripts/prepare-thumbs.mjs

      # Save before Pages 配置步骤，配置错误也不会丢失封面缓存
      - name: Save static cover cache
        if: steps.cover-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: covers
          key: covers-v3-${{ inputs.cover_limit || '0' }}-${{ github.sha }}

      - name: Assemble static artifact
        run: |
          mkdir -p dist
          cp index.html style.css graph.json main.bundle.js dist/
          touch dist/.nojekyll
          cp -r covers dist/

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          token: ${{ secrets.PAGES_TOKEN || github.token }}
          enablement: ${{ secrets.PAGES_TOKEN != '' }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4