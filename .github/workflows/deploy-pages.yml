name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # 每周从上游 Releases 拉最新数据包并复查封面，数据更新无需本仓库改动
    - cron: "30 2 * * 0"
  workflow_dispatch:
    inputs:
      cover_limit:
        description: "封面数量上限（0 = 下载全部）"
        required: false
        default: "0"
        type: string
      refresh_covers:
        description: "强制复查所有封面"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 仓库只做渲染，图数据从上游 InfGithub/mcmod-star-graph 的 Releases 抓取，
      # 不依赖仓库内文件（浏览器无法跨域 fetch release 资产，故抓取在构建期完成）。
      - name: Fetch latest graph data from upstream releases
        id: fetch-data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          API="repos/InfGithub/mcmod-star-graph/releases/latest"
          tag="$(gh api "$API" --jq '.tag_name')"
          asset="$(gh api "$API" --jq '[.assets[] | select(.name | startswith("graph-") and endswith(".json")) | .name][0] // ""')"
          if [ -z "$asset" ]; then
            echo "::error::上游最新 release 没有 graph-*.json 资产 (tag=$tag)"
            exit 1
          fi
          curl -fL --retry 3 -o graph.json \
            "https://github.com/InfGithub/mcmod-star-graph/releases/download/${tag}/${asset}"
          echo "asset=${asset}" >> "$GITHUB_OUTPUT"
          echo "fetched $asset (tag $tag)"

      - name: Restore static cover cache
        id: cover-cache
        uses: actions/cache/restore@v4
        with:
          path: covers
          key: covers-v3-${{ steps.fetch-data.outputs.asset }}-${{ inputs.cover_limit || '0' }}-${{ (github.event_name == 'schedule' || inputs.refresh_covers) && github.run_id || github.sha }}
          restore-keys: |
            covers-v3-${{ steps.fetch-data.outputs.asset }}-${{ inputs.cover_limit || '0' }}-
            covers-v3-

      # 封面由 CI 下载到 covers/（MC 百科防盗链只认服务端 Referer，浏览器直连会被
      # 403，因此下载发生在构建期）；与数据包版本一致的缓存直接复用。
      - name: Pre-generate cover assets (diff only)
        env:
          COVER_LIMIT: ${{ inputs.cover_limit || '0' }}
          COVER_REFRESH_ALL: ${{ github.event_name == 'schedule' || inputs.refresh_covers }}
          COVER_CONCURRENCY: 12
          COVER_RETRIES: 2
        run: node scripts/prepare-covers.mjs

      # Save before Pages 配置步骤，配置错误也不会丢失封面缓存
      - name: Save static cover cache
        if: steps.cover-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: covers
          key: covers-v3-${{ steps.fetch-data.outputs.asset }}-${{ inputs.cover_limit || '0' }}-${{ (github.event_name == 'schedule' || inputs.refresh_covers) && github.run_id || github.sha }}

      - name: Assemble static artifact
        run: |
          mkdir -p dist
          cp index.html style.css graph.json main.bundle.js dist/
          touch dist/.nojekyll
          cp -r covers dist/

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          token: ${{ secrets.PAGES_TOKEN || github.token }}
          enablement: ${{ secrets.PAGES_TOKEN != '' }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4